---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - git
      - vim
      - htop
      - net-tools
    state: present

- name: Set timezone to UTC
  timezone:
    name: UTC

- name: Configure firewall - allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Configure firewall - allow HTTP
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Enable firewall
  ufw:
    state: enabled
    policy: deny
